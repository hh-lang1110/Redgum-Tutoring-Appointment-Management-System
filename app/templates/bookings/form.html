{% extends "base.html" %}
{% block title %}New Booking · Redgum Tutoring{% endblock %}
{% block content %}
<h1>New Booking</h1>
<form method="post" class="mt-3" style="max-width:600px">
  <div class="mb-3">
    <label class="form-label">Tutor *</label>
    <select class="form-select" name="tutor_id" required>
      <option value="">-- choose --</option>
      {% for t in tutors %}
        <option value="{{ t.id }}" {% if form and form.tutor_id|int == t.id %}selected{% endif %}>{{ t.name }} ({{ t.subjects }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Student *</label>
    <select class="form-select" name="student_id" required>
      <option value="">-- choose --</option>
      {% for s in students %}
        <option value="{{ s.id }}" {% if form and form.student_id|int == s.id %}selected{% endif %}>{{ s.name }} ({{ s.enrolled_subjects }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Subject *</label>
    <input class="form-control" name="subject" required value="{{ form.subject if form else '' }}" placeholder="Math">
  </div>
  <div class="row">
    <div class="col mb-3">
      <label class="form-label">Day *</label>
      <select class="form-select" name="weekday" required>
        {% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}
          <option value="{{ loop.index0 }}">{{ d }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col mb-3">
      <label class="form-label">Start time *</label>
      <input class="form-control" type="time" name="start_time" required value="{{ form.start_time if form else '15:00' }}">
    </div>
    <div class="col mb-3">
      <label class="form-label">Duration (min)</label>
      <input class="form-control" type="number" name="duration_minutes" value="{{ form.duration_minutes if form else 60 }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Room</label>
    <input class="form-control" name="room" value="{{ form.room if form else '' }}" placeholder="Room 1">
  </div>
  <button class="btn btn-primary">Create booking</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('bookings.list_bookings') }}">Cancel</a>
</form>
{% endblock %}
