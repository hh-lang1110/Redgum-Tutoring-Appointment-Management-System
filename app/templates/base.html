<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Redgum Tutoring{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('schedule.weekly') }}">Redgum Tutoring</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('schedule.weekly') }}">Schedule</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('sessions.list_sessions') }}">Sessions</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('tutors.list_tutors') }}">Tutors</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('students.list_students') }}">Students</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('stats.dashboard') }}">Statistics</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('sessions.new_session') }}">+ Book session</a></li>
    </ul>
  </div>
</nav>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
