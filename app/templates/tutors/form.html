{% extends "base.html" %}
{% block title %}{{ 'Edit' if tutor else 'New' }} Tutor · Redgum Tutoring{% endblock %}
{% block content %}
<h1>{{ 'Edit' if tutor else 'New' }} Tutor</h1>
<form method="post" class="mt-3" style="max-width:600px">
  <div class="mb-3">
    <label class="form-label">Name *</label>
    <input class="form-control" name="name" required value="{{ tutor.name if tutor else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Subjects (comma-separated) *</label>
    <input class="form-control" name="subjects" required value="{{ tutor.subjects if tutor else '' }}" placeholder="Math,Physics">
  </div>
  <div class="mb-3">
    <label class="form-label">Qualification</label>
    <input class="form-control" name="qualification" value="{{ tutor.qualification if tutor else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input class="form-control" name="phone" value="{{ tutor.phone if tutor else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" name="email" value="{{ tutor.email if tutor else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Availability note</label>
    <input class="form-control" name="availability_note" value="{{ tutor.availability_note if tutor else '' }}">
  </div>
  {% if tutor %}
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" name="is_active" id="is_active" {% if tutor.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">Active</label>
  </div>
  {% endif %}
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('tutors.list_tutors') }}">Cancel</a>
</form>
{% endblock %}
