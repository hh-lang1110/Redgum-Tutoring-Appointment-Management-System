{% extends "base.html" %}
{% block title %}Student - Redgum{% endblock %}
{% block content %}
<h2>{{ "Edit" if student.id else "Add" }} student</h2>
<form method="post" class="row g-3">
  <div class="col-md-6"><label class="form-label">Name</label>
    <input class="form-control" name="name" value="{{ student.name or '' }}" required></div>
  <div class="col-md-3"><label class="form-label">Year level</label>
    <input class="form-control" name="year_level" value="{{ student.year_level or '' }}" placeholder="Year 10"></div>
  <div class="col-md-3"><label class="form-label">Subjects</label>
    <input class="form-control" name="enrolled_subjects" value="{{ student.enrolled_subjects or '' }}"></div>
  <div class="col-md-6"><label class="form-label">Parent contact</label>
    <input class="form-control" name="parent_contact" value="{{ student.parent_contact or '' }}"></div>
  <div class="col-md-6"><label class="form-label">Parent phone</label>
    <input class="form-control" name="parent_phone" value="{{ student.parent_phone or '' }}"></div>
  <div class="col-12">
    <button class="btn btn-primary">Save</button>
    {% if student.id and student.is_active %}
      <button class="btn btn-warning" name="deactivate" value="1">Make inactive</button>
    {% elif student.id %}
      <button class="btn btn-success" name="reactivate" value="1">Reactivate</button>
    {% endif %}
    <a class="btn btn-secondary" href="{{ url_for('students.list_students') }}">Cancel</a>
  </div>
</form>
{% endblock %}
