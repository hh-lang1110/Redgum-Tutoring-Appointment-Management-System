{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'New' }} Student · Redgum Tutoring{% endblock %}
{% block content %}
<h1>{{ 'Edit' if student else 'New' }} Student</h1>
<form method="post" class="mt-3" style="max-width:600px">
  <div class="mb-3">
    <label class="form-label">Name *</label>
    <input class="form-control" name="name" required value="{{ student.name if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Grade level</label>
    <input class="form-control" name="grade_level" value="{{ student.grade_level if student else '' }}" placeholder="Year 10">
  </div>
  <div class="mb-3">
    <label class="form-label">Enrolled subjects (comma-separated)</label>
    <input class="form-control" name="enrolled_subjects" value="{{ student.enrolled_subjects if student else '' }}" placeholder="Math,Physics">
  </div>
  <hr>
  <div class="mb-3">
    <label class="form-label">Parent name</label>
    <input class="form-control" name="parent_name" value="{{ student.parent_name if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Parent phone</label>
    <input class="form-control" name="parent_phone" value="{{ student.parent_phone if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Parent email</label>
    <input class="form-control" name="parent_email" value="{{ student.parent_email if student else '' }}">
  </div>
  {% if student %}
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" name="is_active" id="is_active" {% if student.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">Active</label>
  </div>
  {% endif %}
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('students.list_students') }}">Cancel</a>
</form>
{% endblock %}
